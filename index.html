<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Student Plate – Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef6f0;--card:#fff;--ink:#0f2a1b;--mut:#547060;--line:#dbe9df;--acc:#0f8a4f;--onacc:#fff;--acc2:#f5c542;--tag:#e2f3e8;--model:#eceffd;--modelink:#34449a;--sh:0 1px 2px #0f2a1b12,0 8px 24px #0f2a1b0f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1712;--card:#16221b;--ink:#eaf5ee;--mut:#9bb5a5;--line:#263a2e;--acc:#3ddc84;--onacc:#06170d;--tag:#1c3326;--model:#1e2440;--modelink:#b3bffa;--sh:0 1px 2px #0006}}
:root[data-theme="dark"]{--bg:#0e1712;--card:#16221b;--ink:#eaf5ee;--mut:#9bb5a5;--line:#263a2e;--acc:#3ddc84;--onacc:#06170d;--tag:#1c3326;--model:#1e2440;--modelink:#b3bffa;--sh:0 1px 2px #0006}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,"Segoe UI",sans-serif}
h1,h2,h3{margin:0 0 .4em;line-height:1.15;letter-spacing:-.02em;font-weight:800}
h1{font-size:clamp(26px,5vw,38px)}h2{font-size:20px}h3{font-size:18px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center}
header b{font-weight:800;font-size:19px;letter-spacing:-.02em}
nav{display:flex;flex-wrap:wrap;gap:4px}
nav button{background:transparent;border:0;color:var(--mut);border-radius:999px;padding:7px 14px;cursor:pointer;font:600 14px Inter,sans-serif}
nav button.on{background:var(--acc);color:var(--onacc)}
main{max-width:1000px;margin:0 auto;padding:20px}
.hero{background:linear-gradient(135deg,#0a5c36,#0f8a4f 70%,#37b56f);color:#fff;border-radius:24px;padding:28px 26px;margin-bottom:18px}
.hero p{margin:0;max-width:520px;opacity:.92}
.bar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;margin-bottom:14px;color:var(--mut);font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;font:600 14px Inter,sans-serif}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
select{font:600 14px Inter,sans-serif;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
input[type=range]{accent-color:var(--acc);vertical-align:middle}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:var(--card);border-radius:20px;padding:12px 12px 16px;cursor:pointer;box-shadow:var(--sh);transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.card h3{margin:2px 6px 4px}.card .meta,.card .price,.card div:not(.img){margin-left:6px;margin-right:6px}
.panel{background:var(--card);border-radius:20px;padding:22px;margin-bottom:16px;box-shadow:var(--sh)}
.img{height:120px;border-radius:14px;margin-bottom:12px;display:flex;align-items:center;justify-content:center;font-size:52px;background:linear-gradient(135deg,var(--tag),color-mix(in srgb,var(--acc) 22%,var(--card)))}
.price{font-weight:800;font-size:24px;color:var(--acc);letter-spacing:-.02em}
.tag{display:inline-block;background:var(--tag);border-radius:999px;padding:2px 11px;font-size:12.5px;font-weight:600;margin:0 4px 4px 0}
.promo{background:var(--acc2);color:#3a2b00;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700}
.meta{color:var(--mut);font-size:14px}
a.l{color:var(--acc);font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer;background:none;border:0;font:inherit;font-weight:600;padding:0}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:600;font-size:13px}
.scroll{overflow-x:auto}
.best{background:var(--tag);font-weight:700}
.save{border:0;background:var(--tag);color:var(--ink);border-radius:999px;padding:9px 18px;cursor:pointer;font:600 14px Inter,sans-serif}
.save.on{background:var(--acc);color:var(--onacc)}
.model{background:var(--model);color:var(--modelink);border-radius:14px;padding:12px 16px;font-size:13px;margin-top:20px}
.model code{background:#0001;border-radius:6px;padding:1px 6px}
.back{margin-bottom:12px;display:inline-block}
.meter{height:10px;background:var(--tag);border-radius:999px;overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--acc);border-radius:999px}
.nut{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.nut div{background:var(--tag);border-radius:14px;padding:10px 12px}
.nut b{display:block;font-size:20px}.nut span{font-size:12.5px;color:var(--mut)}
input[type=number]{font:600 14px Inter,sans-serif;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
</style></head><body>
<header><b>Student Plate</b><nav id="nav"></nav></header>
<main id="app"></main>
<script>
const ING={
chicken:{n:'Chicken breast',e:'🍗',cat:'Protein',kcal:165,alt:'chicken fillets',sub:['eggs']},
pasta:{n:'Pasta',e:'🍝',cat:'Grain',kcal:350,alt:'macaroni, spaghetti',sub:['rice']},
rice:{n:'Rice',e:'🍚',cat:'Grain',kcal:130,alt:'long grain rice',sub:['pasta']},
eggs:{n:'Eggs',e:'🥚',cat:'Protein',kcal:143,alt:'large eggs',sub:['chicken']},
onion:{n:'Onion',e:'🧅',cat:'Vegetable',kcal:40,alt:'brown onions',sub:[]},
mayo:{n:'Mayonnaise',e:'🥫',cat:'Pantry',kcal:680,alt:'mayo',sub:[]}};
const STORES=['Shoprite','Checkers','Pick n Pay'];
const P=[ // ingredient, store, product, amount(ZAR), pack size, unit, promo
['chicken','Shoprite','Chicken fillets 500 g',45.99,500,'g'],['chicken','Checkers','Chicken breast 500 g',49.99,500,'g'],['chicken','Pick n Pay','Chicken breast 500 g',47.99,500,'g','Save R5'],
['pasta','Shoprite','Spaghetti 500 g',19.99,500,'g'],['pasta','Checkers','Spaghetti 500 g',21.99,500,'g'],['pasta','Pick n Pay','Spaghetti 500 g',18.99,500,'g'],
['rice','Shoprite','Long grain rice 1 kg',32.99,1000,'g'],['rice','Checkers','Long grain rice 1 kg',34.99,1000,'g'],['rice','Pick n Pay','Long grain rice 1 kg',33.99,1000,'g'],
['eggs','Shoprite','Large eggs 6',22.99,6,'each'],['eggs','Checkers','Large eggs 6',24.99,6,'each'],['eggs','Pick n Pay','Large eggs 6',21.99,6,'each','Buy 2 for R40'],
['onion','Shoprite','Onions 1 kg',19.99,1000,'g'],['onion','Checkers','Onions 1 kg',22.99,1000,'g'],['onion','Pick n Pay','Onions 1 kg',21.99,1000,'g'],
['mayo','Shoprite','Mayonnaise 750 g',39.99,750,'g'],['mayo','Checkers','Mayonnaise 750 g',42.99,750,'g'],['mayo','Pick n Pay','Mayonnaise 750 g',41.99,750,'g']
].map(a=>({ing:a[0],store:a[1],product:a[2],amt:a[3],pack:a[4],unit:a[5],promo:a[6]}));
const R={
r1:{t:'Chicken mayo pasta',e:'🍝',sum:'Creamy one-pot pasta with chicken.',prep:10,cook:15,srv:2,prot:28,kcal:520,fat:22,carb:55,meal:'Dinner',diet:['high-protein'],auth:'Student Kitchen',tech:['Boiling','Frying'],ing:[['chicken',250,'g'],['pasta',250,'g'],['mayo',60,'g'],['onion',100,'g']],steps:['Boil the pasta for 10 minutes and drain.','Fry the chopped onion, then the diced chicken until cooked.','Stir in the pasta and mayonnaise. Serve hot.']},
r2:{t:'Egg fried rice',e:'🍳',sum:'Fast rice with scrambled egg and onion.',prep:5,cook:15,srv:2,prot:18,kcal:430,fat:14,carb:58,meal:'Lunch',diet:['vegetarian'],auth:'Student Kitchen',tech:['Frying'],ing:[['rice',200,'g'],['eggs',3,'each'],['onion',100,'g']],steps:['Cook the rice and let it cool.','Fry the onion, then scramble the eggs in the pan.','Add the rice and fry for 3 minutes.']},
r3:{t:'Chicken rice bowl',e:'🍛',sum:'Simple chicken over rice, cheap and filling.',prep:10,cook:20,srv:2,prot:32,kcal:560,fat:12,carb:78,meal:'Dinner',diet:['high-protein'],auth:'Campus Cook',tech:['Boiling','Frying'],ing:[['chicken',200,'g'],['rice',200,'g'],['onion',100,'g']],steps:['Boil the rice for 15 minutes.','Fry the onion and chicken pieces until browned.','Serve the chicken over the rice.']}};

Object.assign(ING,{
beans:{n:'Baked beans',e:'🫘',cat:'Pantry',kcal:95,alt:'tinned beans',sub:['eggs']},
bread:{n:'Brown bread',e:'🍞',cat:'Grain',kcal:250,alt:'sliced loaf',sub:[]},
potato:{n:'Potatoes',e:'🥔',cat:'Vegetable',kcal:77,alt:'spuds',sub:['rice','pasta']},
mince:{n:'Beef mince',e:'🥩',cat:'Protein',kcal:250,alt:'ground beef',sub:['chicken']},
tomato:{n:'Tinned tomatoes',e:'🍅',cat:'Pantry',kcal:32,alt:'chopped tomatoes',sub:[]}});
P.push(...[
['beans','Shoprite','Baked beans 410 g',11.99,410,'g'],['beans','Checkers','Baked beans 410 g',12.99,410,'g'],['beans','Pick n Pay','Baked beans 410 g',11.49,410,'g'],
['bread','Shoprite','Brown bread, 12 slices',17.99,12,'each'],['bread','Checkers','Brown bread, 12 slices',19.99,12,'each'],['bread','Pick n Pay','Brown bread, 12 slices',18.49,12,'each'],
['potato','Shoprite','Potatoes 2 kg',34.99,2000,'g'],['potato','Checkers','Potatoes 2 kg',38.99,2000,'g'],['potato','Pick n Pay','Potatoes 2 kg',36.99,2000,'g'],
['mince','Shoprite','Beef mince 500 g',54.99,500,'g'],['mince','Checkers','Beef mince 500 g',59.99,500,'g'],['mince','Pick n Pay','Beef mince 500 g',56.99,500,'g','Save R6'],
['tomato','Shoprite','Chopped tomatoes 400 g',9.99,400,'g'],['tomato','Checkers','Chopped tomatoes 400 g',11.49,400,'g'],['tomato','Pick n Pay','Chopped tomatoes 400 g',10.49,400,'g']
].map(a=>({ing:a[0],store:a[1],product:a[2],amt:a[3],pack:a[4],unit:a[5],promo:a[6]})));
Object.assign(R,{
r4:{t:'Egg and beans on toast',e:'🍞',sum:'A quick, filling breakfast for under R30.',prep:5,cook:8,srv:2,prot:20,kcal:480,fat:14,carb:62,meal:'Breakfast',diet:['vegetarian'],auth:'Student Kitchen',tech:['Frying'],ing:[['beans',410,'g'],['bread',4,'each'],['eggs',2,'each']],steps:['Warm the beans in a pot.','Fry the eggs and toast the bread.','Top the toast with beans and egg.']},
r5:{t:'Mince and potato bake',e:'🥔',sum:'A hearty tray bake that feeds you for two days.',prep:15,cook:40,srv:3,prot:26,kcal:610,fat:24,carb:68,meal:'Dinner',diet:['high-protein'],auth:'Campus Cook',tech:['Boiling','Baking'],ing:[['mince',250,'g'],['potato',500,'g'],['onion',100,'g'],['tomato',400,'g']],steps:['Boil the sliced potatoes for 10 minutes.','Fry the onion and mince, then add the tomatoes.','Layer the mince and potatoes in a dish and bake for 25 minutes.']},
r6:{t:'Tomato pasta',e:'🍅',sum:'The cheapest meal on the site, ready in 20 minutes.',prep:5,cook:15,srv:2,prot:14,kcal:480,fat:4,carb:92,meal:'Lunch',diet:['vegetarian','dairy-free'],auth:'Student Kitchen',tech:['Boiling'],ing:[['pasta',250,'g'],['tomato',400,'g'],['onion',100,'g']],steps:['Boil the pasta.','Fry the onion and add the tomatoes for 8 minutes.','Mix the sauce through the pasta.']},
r7:{t:'Potato and egg hash',e:'🍳',sum:'Crispy potatoes with fried eggs.',prep:10,cook:20,srv:2,prot:16,kcal:520,fat:22,carb:62,meal:'Breakfast',diet:['vegetarian'],auth:'Campus Cook',tech:['Boiling','Frying'],ing:[['potato',400,'g'],['eggs',3,'each'],['onion',100,'g']],steps:['Boil the diced potatoes for 8 minutes.','Fry them with the onion until crisp.','Make gaps and cook the eggs on top.']},
r8:{t:'Mince rice bowl',e:'🍲',sum:'Saucy mince over rice, good for meal prep.',prep:10,cook:25,srv:3,prot:30,kcal:590,fat:18,carb:72,meal:'Dinner',diet:['high-protein'],auth:'Campus Cook',tech:['Boiling','Frying'],ing:[['mince',250,'g'],['rice',200,'g'],['tomato',400,'g'],['onion',100,'g']],steps:['Cook the rice.','Brown the mince with the onion.','Add the tomatoes and simmer for 15 minutes. Serve over rice.']}});
const T={prot:60,kcal:2000,budget:60};
let S={month:1500,mpd:3,planIds:[],log:[{k:'r4',srv:1,slot:'Breakfast'},{k:'r6',srv:1,slot:'Lunch'}],meal:'All',v:'home',id:null,store:'Cheapest',max:60,saved:new Set(['r2'])};
const z=n=>'R'+n.toFixed(2);
const pricesFor=i=>P.filter(p=>p.ing===i);
const cheapest=i=>pricesFor(i).reduce((a,b)=>a.amt<=b.amt?a:b);
const pick=i=>S.store==='Cheapest'?cheapest(i):pricesFor(i).find(p=>p.store===S.store);
const line=(l)=>{const p=pick(l[0]);return l[1]/p.pack*p.amt};
const cost=r=>r.ing.reduce((s,l)=>s+line(l),0);
const model=(types,note)=>`<div class="model"><b>Content types on this screen:</b> ${types.map(t=>`<code>${t}</code>`).join(' ')}<br>${note}</div>`;
function go(v,id){S.v=v;S.id=id||null;render();scrollTo(0,0)}
function bar(){return `<div class="bar"><label>My store <select onchange="S.store=this.value;render()">${['Cheapest',...STORES].map(s=>`<option ${s===S.store?'selected':''}>${s}</option>`).join('')}</select></label></div>`}
function card(k){const r=R[k];return `<div class="card" onclick="go('recipe','${k}')"><div class="img">${r.e}</div><h3>${r.t}</h3><div class="meta">${r.sum}</div><div class="price">${z(cost(r))}</div><div class="meta">${z(cost(r)/r.srv)} per serving · ${r.prep+r.cook} min</div><div style="margin-top:6px"><span class="tag">${r.prot} g protein</span><span class="tag">${r.kcal} kcal</span>${r.diet.map(d=>`<span class="tag">${d}</span>`).join('')}${S.saved.has(k)?'<span class="tag">★ saved</span>':''}</div></div>`}
function home(){const ks=Object.keys(R).filter(k=>cost(R[k])<=S.max&&(S.meal==='All'||R[k].meal===S.meal));
const low=Object.keys(R).map(k=>[k,cost(R[k])]).sort((a,b)=>a[1]-b[1])[0];
return `<div class="hero"><h1>Eat well on a student budget</h1><p>${Object.keys(R).length} recipes priced from real store packs. Cheapest right now: <b>${R[low[0]].t}</b> at ${z(low[1])}.</p></div>
<div class="bar"><div class="chips">${['All','Breakfast','Lunch','Dinner'].map(m=>`<button class="chip ${S.meal===m?'on':''}" onclick="S.meal='${m}';render()">${m}</button>`).join('')}</div>
<label>My store <select onchange="S.store=this.value;render()">${['Cheapest',...STORES].map(s=>`<option ${s===S.store?'selected':''}>${s}</option>`).join('')}</select></label>
<label>Max cost <b id="mx">${z(S.max)}</b> <input type="range" min="20" max="80" step="5" value="${S.max}" oninput="mx.textContent=z(+this.value)" onchange="S.max=+this.value;render()"></label></div>
<p class="meta">${ks.length} recipes shown</p><div class="grid">${ks.map(card).join('')||'<p>No recipes match. Raise the cost limit or choose All.</p>'}</div>
${model(['Recipe (card)','Price','Store','Meal Type (taxonomy)'],'Cards show title, image, prep time and protein from <code>Recipe</code>. Meal type filters use the taxonomy. The cost is derived from <code>Price</code> records at your chosen store, so it changes with the store and the budget.')}`}
function recipe(){const k=S.id,r=R[k];
return `<a class="l back" onclick="go('home')">← All recipes</a><div class="panel"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><div><h1>${r.e} ${r.t}</h1><div class="meta">By ${r.auth} · ${r.meal} · ${r.prep} min prep + ${r.cook} min cook · serves ${r.srv}</div></div><button class="save ${S.saved.has(k)?'on':''}" onclick="S.saved.has('${k}')?S.saved.delete('${k}'):S.saved.add('${k}');render()">${S.saved.has(k)?'★ Saved':'☆ Save recipe'}</button></div>
<p>${r.sum}</p><div>${r.tech.map(t=>`<span class="tag">${t}</span>`).join('')}<span class="tag">${r.prot} g protein</span><span class="tag">${r.kcal} kcal</span></div>
<div class="price" style="margin-top:8px">${z(cost(r))} <span class="meta" style="font:14px sans-serif">total · ${z(cost(r)/r.srv)} per serving</span></div></div>
<div class="panel"><h2>Nutrition per serving</h2><div class="nut">${[['Energy',r.kcal+' kcal'],['Protein',r.prot+' g'],['Fat',r.fat+' g'],['Carbs',r.carb+' g']].map(x=>`<div><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')}</div>
<p class="meta">Protein is ${Math.round(r.prot/T.prot*100)}% of the example daily target (${T.prot} g). Values are estimates for the sample data.</p>
<button class="save on" onclick="logMeal('${k}',1)">Log 1 serving</button></div>
<div class="panel"><h2>Ingredients and cost</h2>${bar()}<div class="scroll"><table><tr><th>Ingredient</th><th>Amount</th><th>Product (from pack)</th><th>Cost</th></tr>
${r.ing.map(l=>{const p=pick(l[0]);return `<tr><td><a class="l" onclick="go('ing','${l[0]}')">${ING[l[0]].n}</a></td><td>${l[1]} ${l[2]}</td><td>${p.product} · ${z(p.amt)} (${p.store})</td><td>${z(line(l))}</td></tr>`}).join('')}
<tr><th colspan="3">Estimated cost</th><th>${z(cost(r))}</th></tr></table></div><p class="meta">Cost = quantity used ÷ pack size × price. Illustrative prices.</p></div>
<div class="panel"><h2>Method</h2><ol>${r.steps.map(s=>`<li>${s}</li>`).join('')}</ol></div>
${model(['Recipe','Recipe Ingredient','Ingredient','Price','Cooking Technique','Chef/Author','Saved Recipe','Nutrition','Meal Log'],'Each ingredient row is a <code>Recipe Ingredient</code> (quantity, unit) that references an <code>Ingredient</code>; click one to open its page. The cost is derived, not typed in.')}`}
function ing(){const k=S.id,g=ING[k];const rs=Object.keys(R).filter(x=>R[x].ing.some(l=>l[0]===k));
return `<a class="l back" onclick="history.length&&go('home')">← Home</a><div class="panel"><h1>${g.e} ${g.n}</h1><div class="meta">Category: ${g.cat} · ${g.kcal} kcal per 100 g · also called ${g.alt}</div>
<p><b>Swaps:</b> ${g.sub.length?g.sub.map(s=>`<a class="l" onclick="go('ing','${s}')">${ING[s].n}</a>`).join(', '):'none listed'}</p>
<button class="save on" onclick="go('cmp','${k}')">Compare store prices</button></div>
<div class="panel"><h2>Recipes that use ${g.n.toLowerCase()}</h2><div class="grid">${rs.map(card).join('')}</div></div>
${model(['Ingredient','Recipe Ingredient','Recipe (card)','Price'],'This is the <i>upward</i> link: the same <code>Recipe</code> cards are reused here, found through <code>Recipe Ingredient</code>. Swaps are <code>Ingredient</code> to <code>Ingredient</code> references.')}`}
function cmp(){const k=S.id,g=ING[k],ps=pricesFor(k),best=cheapest(k);
return `<a class="l back" onclick="go('ing','${k}')">← ${g.n}</a><div class="panel"><h1>${g.e} ${g.n}: store prices</h1><p class="meta">Prices checked 25 September 2026 (illustrative).</p><div class="scroll"><table><tr><th>Store</th><th>Product</th><th>Price</th><th>Per 100 ${g.n&&ps[0].unit==='g'?'g':'each'}</th><th></th></tr>
${ps.map(p=>`<tr class="${p===best?'best':''}"><td>${p.store}</td><td>${p.product}</td><td>${z(p.amt)}</td><td>${z(p.amt/p.pack*(p.unit==='g'?100:1))}</td><td>${p===best?'Cheapest ':''}${p.promo?`<span class="promo">${p.promo}</span>`:''}</td></tr>`).join('')}</table></div></div>
${model(['Price','Store','Ingredient'],'Each row is a <code>Price</code> record linked to a <code>Store</code>. Change a price and every recipe cost updates, with no recipe edited.')}`}
function saved(){const l=Object.keys(R).filter(k=>S.saved.has(k));
const list={};l.forEach(k=>R[k].ing.forEach(x=>list[x[0]]=(list[x[0]]||0)+x[1]));
return `<h1>Saved recipes</h1>${bar()}<div class="grid">${l.map(card).join('')||'<p>Nothing saved yet. Open a recipe and choose Save.</p>'}</div>
<div class="panel" style="margin-top:14px"><h2>Shopping list</h2><ul>${Object.keys(list).map(i=>`<li>${ING[i].n}: ${list[i]} ${pricesFor(i)[0].unit} · <a class="l" onclick="go('cmp','${i}')">cheapest: ${cheapest(i).store}</a></li>`).join('')||'<li>Empty</li>'}</ul></div>
${model(['Saved Recipe','Recipe (card)','Recipe Ingredient'],'The shopping list is built by adding up <code>Recipe Ingredient</code> quantities across saved recipes: same content, new presentation.')}`}
function logMeal(k,n,slot,stay){S.log.push({k,srv:n,slot:slot||R[k].meal});stay?render():go('track')}
function track(){const L=S.log.map(e=>{const r=R[e.k];return{...e,r,kcal:r.kcal*e.srv,prot:r.prot*e.srv,fat:r.fat*e.srv,carb:r.carb*e.srv,c:cost(r)/r.srv*e.srv}});
const sum=q=>L.reduce((a,x)=>a+x[q],0);
const m=(lab,v,t,u)=>`<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;gap:8px"><b>${lab}</b><span class="meta">${u==='R'?z(v)+' of '+z(t):Math.round(v)+' of '+t+' '+u}</span></div><div class="meter"><i style="width:${Math.min(100,v/t*100)}%;${v>t?'background:#d9534f':''}"></i></div></div>`;
const opt=a=>a.map(x=>`<option>${x}</option>`).join('');
return `<h1>Meal tracker</h1>${bar()}<div class="panel"><h2>Today</h2>${m('Energy',sum('kcal'),T.kcal,'kcal')}${m('Protein',sum('prot'),T.prot,'g')}${m('Food spend',sum('c'),T.budget,'R')}
<p class="meta">Fat ${Math.round(sum('fat'))} g, carbs ${Math.round(sum('carb'))} g. The targets are examples. Change them to suit you.</p>
<div class="bar"><label>Energy <input type="number" value="${T.kcal}" style="width:90px" onchange="T.kcal=+this.value;render()"> kcal</label><label>Protein <input type="number" value="${T.prot}" style="width:70px" onchange="T.prot=+this.value;render()"> g</label><label>Daily food budget R <input type="number" value="${T.budget}" style="width:70px" onchange="T.budget=+this.value;render()"></label></div></div>
<div class="panel"><h2>Meals logged</h2><div class="scroll"><table><tr><th>Meal</th><th>Recipe</th><th>Servings</th><th>Energy</th><th>Protein</th><th>Cost</th><th></th></tr>
${L.map((x,i)=>`<tr><td>${x.slot}</td><td><a class="l" onclick="go('recipe','${x.k}')">${x.r.t}</a></td><td>${x.srv}</td><td>${x.kcal} kcal</td><td>${x.prot} g</td><td>${z(x.c)}</td><td><button class="save" onclick="S.log.splice(${i},1);render()">Remove</button></td></tr>`).join('')||'<tr><td colspan="7">Nothing logged yet. Add a meal below or use Log 1 serving on a recipe.</td></tr>'}</table></div>
<div class="bar" style="margin-top:14px"><select id="rsel">${Object.keys(R).map(k=>`<option value="${k}">${R[k].t}</option>`).join('')}</select><select id="ssel">${opt(['Breakfast','Lunch','Dinner','Snack'])}</select><select id="nsel">${opt([1,2])}</select><button class="save on" onclick="logMeal(rsel.value,+nsel.value,ssel.value,true)">Add meal</button></div></div>
${model(['Meal Log (new)','Recipe','Nutrition','Price','User Profile'],'Each entry is a <code>Meal Log</code> record linking the user to a <code>Recipe</code>, with servings and meal slot. Energy, protein and cost are derived from the recipe and its prices, not typed in again.')}`}
function planSave(){S.planIds.forEach(k=>S.saved.add(k));go('saved')}
function plan(){const slots=S.mpd===3?['Breakfast','Lunch','Dinner']:['Lunch','Dinner'];
const D=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],wk=S.month*7/30,ps=k=>cost(R[k])/R[k].srv;
const by=sl=>Object.keys(R).filter(k=>R[k].meal===sl);
const mk=o=>D.map((d,i)=>slots.map(sl=>{const l=o(by(sl));return l[i%l.length]}));
const tot=g=>g.flat().reduce((a,k)=>a+ps(k),0);
let g=mk(l=>l.sort((a,b)=>R[b].prot/ps(b)-R[a].prot/ps(a))),mode='varied, high-protein';
if(tot(g)>wk){g=mk(l=>l.sort((a,b)=>ps(a)-ps(b)).slice(0,1));mode='cheapest options only'}
const wc=tot(g),month=wc*30/7,over=wc>wk;
const need={};g.flat().forEach(k=>R[k].ing.forEach(l=>need[l[0]]=(need[l[0]]||0)+l[1]/R[k].srv));
const gl=Object.keys(need).map(i=>{const p=pick(i),n=Math.ceil(need[i]/p.pack-1e-9);return{i,p,need:need[i],n,c:n*p.amt}});
const shop=gl.reduce((a,x)=>a+x.c,0);S.planIds=[...new Set(g.flat())];
const t=(a,b)=>`<div><b>${a}</b><span>${b}</span></div>`;
return `<h1>Budget planner</h1><div class="panel"><h2>Your food money for the month</h2>
<div class="bar"><label>Amount R <input type="number" value="${S.month}" style="width:100px" onchange="S.month=Math.max(0,+this.value||0);render()"></label>
<label>Meals a day <select onchange="S.mpd=+this.value;render()"><option value="2" ${S.mpd===2?'selected':''}>2 (lunch, dinner)</option><option value="3" ${S.mpd===3?'selected':''}>3 (with breakfast)</option></select></label>
<label>My store <select onchange="S.store=this.value;render()">${['Cheapest',...STORES].map(x=>`<option ${x===S.store?'selected':''}>${x}</option>`).join('')}</select></label></div>
<p style="margin:0">That is about <b>${z(S.month/30)}</b> a day and <b>${z(wk)}</b> a week.</p></div>
<div class="panel"><h2>${over?'Over budget':'Your plan fits'}</h2><div class="nut">${t(z(month),'Food cost per month')}${t(z(wc),'Meals per week')}${t(z(Math.max(0,S.month-month)),'Left for other spending')}${t(z(shop),'First week at the till')}</div>
<p class="meta">Plan type: ${mode}. ${over?`This is about ${z(month-S.month)} a month more than you have. Try 2 meals a day or a cheaper store.`:'Leftover ingredients carry into the next week, so later shops cost less.'}</p></div>
<div class="panel"><h2>Suggested week of meals</h2><div class="scroll"><table><tr><th>Day</th>${slots.map(x=>`<th>${x}</th>`).join('')}</tr>
${g.map((r,i)=>`<tr><td><b>${D[i]}</b></td>${r.map(k=>`<td><a class="l" onclick="go('recipe','${k}')">${R[k].t}</a><div class="meta">${z(ps(k))} · ${R[k].prot} g protein</div></td>`).join('')}</tr>`).join('')}</table></div>
<p style="margin-top:12px"><button class="save on" onclick="planSave()">Save these recipes</button></p></div>
<div class="panel"><h2>Grocery list for the week</h2><div class="scroll"><table><tr><th>Ingredient</th><th>Needed</th><th>Buy</th><th>Cost</th></tr>
${gl.map(x=>`<tr><td><a class="l" onclick="go('ing','${x.i}')">${ING[x.i].n}</a></td><td>${Math.round(x.need)} ${x.p.unit}</td><td>${x.n} × ${x.p.product} (${x.p.store})</td><td>${z(x.c)}</td></tr>`).join('')}
<tr><th colspan="3">Total at the till</th><th>${z(shop)}</th></tr></table></div></div>
${model(['User Profile (monthly amount)','Recipe','Recipe Ingredient','Ingredient','Price','Store'],'The plan is worked out with fixed rules from the monthly amount: pick recipes whose derived cost fits, then add up <code>Recipe Ingredient</code> quantities and round up to whole packs from <code>Price</code> records. Nothing is typed in by hand.')}`}
function render(){const V={home,plan,recipe,ing,cmp,saved,track};
document.getElementById('app').innerHTML=V[S.v]();
const tabs=[['home','Home'],['plan','Planner'],['recipe','Recipe',S.id&&R[S.id]?S.id:'r1'],['ing','Ingredient','chicken'],['cmp','Prices','chicken'],['saved','Saved'],['track','Tracker']];
document.getElementById('nav').innerHTML=tabs.map(t=>`<button class="${S.v===t[0]?'on':''}" onclick="go('${t[0]}','${t[2]||''}')">${t[1]}</button>`).join('')}
render();
</script></body></html>
